<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Green Circular Canvas Gradient -->
    <radialGradient id="greenBg" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#124A3B"/>
      <stop offset="60%" stop-color="#0E3B2E"/>
      <stop offset="100%" stop-color="#07221A"/>
    </radialGradient>

    <!-- Metallic Gold 3D Gradient for Monogram -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E8B2"/>
      <stop offset="25%" stop-color="#DDB26A"/>
      <stop offset="50%" stop-color="#B88A3C"/>
      <stop offset="75%" stop-color="#E5C788"/>
      <stop offset="100%" stop-color="#9C7228"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CE"/>
      <stop offset="40%" stop-color="#E1BC73"/>
      <stop offset="70%" stop-color="#BA8C3E"/>
      <stop offset="100%" stop-color="#8F641F"/>
    </linearGradient>

    <!-- Drop Shadow for 3D Gold Elements -->
    <filter id="goldShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Green Base -->
  <circle cx="250" cy="250" r="245" fill="url(#greenBg)" />

  <!-- Subtle Inner Border Highlight -->
  <circle cx="250" cy="250" r="243" fill="none" stroke="#165B49" stroke-width="2" opacity="0.6"/>

  <!-- Top Interlocking Stylized RHC Crest -->
  <g filter="url(#goldShadow)">
    <!-- Stylized 'R' Stem & Loop -->
    <path d="M 65 95 L 140 95 C 190 95 210 120 210 160 C 210 195 190 220 145 225 L 230 265 L 175 265 L 105 225 L 105 265 L 65 265 Z M 105 130 L 105 190 L 135 190 C 160 190 170 178 170 160 C 170 142 160 130 135 130 Z" fill="url(#goldGradient)" />

    <!-- Stylized 'H' Bar & Ribbon linking to 'C' -->
    <path d="M 190 95 L 230 95 L 230 160 Q 285 160 340 105 L 340 95 L 380 95 L 380 265 L 340 265 L 340 200 Q 285 200 230 255 L 230 265 L 190 265 Z" fill="url(#goldGradient)" opacity="0.95"/>

    <!-- Stylized 'C' Outer Curve -->
    <path d="M 445 135 C 410 95 360 90 320 95 L 320 140 C 350 135 385 140 405 165 C 425 190 425 210 405 235 C 385 260 350 265 320 260 L 320 305 C 360 310 410 305 445 265 C 475 230 475 170 445 135 Z" fill="url(#goldGradient)" />
    
    <!-- Flowing Gold Ribbon connecting H and C -->
    <path d="M 230 185 C 280 185 330 135 375 140 C 350 170 300 220 230 220 Z" fill="url(#goldLight)" />
  </g>

  <!-- Middle Clean Bold 'RHC' Lettering -->
  <g filter="url(#subtleShadow)" fill="url(#goldGradient)">
    <text x="250" y="390" font-family="'Cinzel', 'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="115" font-weight="900" text-anchor="middle" letter-spacing="16">RHC</text>
  </g>

  <!-- Bottom 'GROUP' Lettering -->
  <g filter="url(#subtleShadow)" fill="url(#goldLight)">
    <text x="250" y="445" font-family="'Plus Jakarta Sans', 'Cabinet Grotesk', 'Arial', sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="18">GROUP</text>
  </g>
</svg>
